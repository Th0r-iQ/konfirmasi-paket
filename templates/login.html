<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[ GEAR99 AUTH ]</title>
    <style>
        body { 
            background-color: #0b0c10; 
            color: #45f3ff; 
            font-family: 'Courier New', Courier, monospace; 
            text-align: center; 
            padding-top: 150px; 
            margin: 0;
        }
        .login-box { 
            border: 2px solid #45f3ff; 
            display: inline-block; 
            padding: 40px; 
            background-color: #1f2833; 
            box-shadow: 0 0 20px #45f3ff; 
            border-radius: 8px; 
        }
        h2 { 
            color: #ffffff; 
            margin-top: 0; 
            margin-bottom: 25px; 
            letter-spacing: 1px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input[type="text"], input[type="password"] { 
            width: 250px;
            background-color: #0b0c10; 
            color: #66fcf1; 
            border: 1px solid #45f3ff; 
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            outline: none;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            box-shadow: 0 0 8px #66fcf1;
        }
        input[type="submit"] { 
            background-color: #1f2833; 
            color: #0b0c10; 
            background: #45f3ff;
            border: none; 
            padding: 12px 30px; 
            cursor: pointer; 
            font-weight: bold;
            font-family: monospace;
            font-size: 14px;
            border-radius: 4px;
            transition: 0.3s;
        }
        input[type="submit"]:hover { 
            background-color: #66fcf1; 
            box-shadow: 0 0 15px #66fcf1;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>[ GEAR99 LAB AUTH ]</h2>
        <form action="/login" method="POST">
            <div class="input-group">
                <label>Username:</label>
                <input type="text" name="user" required autocomplete="off">
            </div>
            <div class="input-group">
                <label>Password:</label>
                <input type="password" name="pass" required>
            </div>
            <br>
            <input type="submit" value="MASUK KONSOL">
        </form>
    </div>
</body>
</html>
