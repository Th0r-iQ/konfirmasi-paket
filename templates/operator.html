<!DOCTYPE html>
<html>
<head>
    <title>Gear99 - Dual Active Operator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: #0b0c10; 
            color: #c5c6c7; 
            font-family: 'Courier New', monospace; 
            margin: 0; padding: 0;
            display: flex; height: 100vh; overflow: hidden;
        }

        /* KOLOM KIRI: MONITOR SIMULATOR */
        .kolom-kiri {
            width: 50%;
            background-color: #000;
            border-right: 3px solid #45f3ff;
            display: flex; flex-direction: column;
            position: relative;
        }
        .header-monitor {
            padding: 15px; background-color: #0b0c10;
            color: #45f3ff; font-weight: bold;
            border-bottom: 1px solid #45f3ff;
            text-shadow: 0 0 5px #45f3ff;
        }
        .iframe-container {
            flex: 1; width: 100%; height: 100%; border: none; background-color: #000;
        }

        /* KOLOM KANAN: PANEL AKTIVITAS */
        .kolom-kanan {
            width: 50%; display: flex; flex-direction: column;
            background-color: #1f2833; height: 100vh;
        }
        .panel-header {
            padding: 20px; border-bottom: 2px solid #45f3ff; background-color: #0b0c10;
        }
        .panel-header h2 { margin: 0; color: #45f3ff; font-size: 20px; }
        .panel-konten { padding: 20px; flex: 1; overflow-y: auto; }
        .section-title {
            color: #66fcf1; font-size: 14px; text-transform: uppercase;
            margin-bottom: 10px; letter-spacing: 1px;
            border-bottom: 1px dashed #66fcf1; padding-bottom: 5px;
        }
        .grid-tombol {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 25px;
        }
        .btn-opsi {
            background-color: #0b0c10; color: #45f3ff; border: 1px solid #45f3ff;
            padding: 12px; font-family: inherit; font-weight: bold;
            cursor: pointer; border-radius: 4px; text-align: center;
        }
        .btn-opsi:hover {
            background-color: #45f3ff; color: #0b0c10; box-shadow: 0 0 10px #45f3ff;
        }
        .konsol-log {
            background-color: #000; border: 1px solid #66fcf1; border-radius: 4px;
            padding: 15px; height: 200px; overflow-y: auto;
            font-size: 13px; color: #45f3ff; line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- ================= KOLOM KIRI: ANDROID INTERACTIVE LINK ================= -->
    <div class="kolom-kiri">
        <div class="header-monitor">📱 DOCKER ANDROID INTERACTIVE LINK (SINKRONISASI AKTIF)</div>
        <!-- JALUR KONEKSI LANGSUNG KE PORT VNC DOCKER VPS VIA IP PUBLIK -->
        <iframe class="iframe-container" src="http://45.66.153.149:6080/vnc.html?autoconnect=true&resize=scale" title="Android Controller"></iframe>
    </div>

    <!-- ================= KOLOM KANAN: PANEL UTENSIL ================= -->
    <div class="kolom-kanan">
        <div class="panel-header">
            <h2>[ GEAR99 MANAGEMENT CORE ]</h2>
        </div>
        
        <div class="panel-konten">
            <div class="section-title">Kontrol Sesi Kloning Perangkat</div>
            <div class="grid-tombol">
                <button class="btn-opsi" onclick="kirimAksi('unlock_screen')">🔓 UNLOCK SCREEN REMOTE</button>
                <button class="btn-opsi" onclick="kirimAksi('sync_apps')">🔄 SINKRONISASI APLIKASI</button>
                <button class="btn-opsi" onclick="kirimAksi('force_keep_alive')">🔋 ATUR TETAP MENYALA</button>
                <button class="btn-opsi" onclick="kirimAksi('ping_device')">⚡ CEK STATUS JALUR</button>
            </div>

            <div class="section-title">Riwayat Log Sinkronisasi Dua Arah</div>
            <div id="output-log" class="konsol-log">
                [SYSTEM] Jalur interkoneksi dua arah diaktifkan...<br>
                [SYSTEM] Menunggu sinkronisasi ID akun eksternal.<br>
            </div>
        </div>
    </div>

    <script>
        function kirimAksi(perintah) {
            fetch('/send_command', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ command: perintah })
            }).then(() => {
                let logBox = document.getElementById('output-log');
                logBox.innerHTML += `[${new Date().toLocaleTimeString()}] Perintah [${perintah.toUpperCase()}] dikirim ke sistem clone...<br>`;
                logBox.scrollTop = logBox.scrollHeight;
            });
        }

        function muatLogSistem() {
            fetch('/get_logs')
                .then(res => res.json())
                .then(data => {
                    if(data.logs && data.logs.length > 0) {
                        let logBox = document.getElementById('output-log');
                        logBox.innerHTML = data.logs.join('<br>');
                        logBox.scrollTop = logBox.scrollHeight;
                    }
                });
        }
        setInterval(muatLogSistem, 2000);
    </script>
</body>
</html>
