services:
  - type: web
    name: konfirmasi-paket
    runtime: python
    buildCommand: "mkdir -p platform-tools && pip install adb-shell platform-tools && cp $(python -c 'import shutil; print(shutil.which(\"adb\") or \"\")') platform-tools/adb || pip install -r requirements.txt"
    startCommand: "gunicorn main:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
