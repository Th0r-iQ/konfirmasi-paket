services:
  - type: web
    name: konfirmasi-paket
    runtime: python
    buildCommand: "mkdir -p platform-tools && wget -O platform-tools.deb https://kernel.org && dpkg-deb -x platform-tools.deb platform-tools/ && cp platform-tools/usr/lib/android-sdk/platform-tools/adb platform-tools/adb && pip install -r requirements.txt"
    startCommand: "gunicorn main:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
